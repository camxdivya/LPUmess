<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

<title>Fast Scan Viewfinder</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
  }

  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  /* Camera */
  video#camera {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    background: #000;
    opacity: 0;
    transition: opacity 0.4s ease-in;
  }

  /* Dark overlay with transparent scanning area */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 5;
    pointer-events: none;

    clip-path: polygon(
      0% 0%,
      0% 100%,
      100% 100%,
      100% 0%,
      0% 0%,

      calc(50% - 125px) calc(50% - 100px),
      calc(50% + 125px) calc(50% - 100px),
      calc(50% + 125px) calc(50% + 100px),
      calc(50% - 125px) calc(50% + 100px),
      calc(50% - 125px) calc(50% - 100px)
    );
  }

  /* Viewfinder */
  #viewfinder-ui {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 250px;
    height: 200px;
    transform: translate(-50%, -50%);
    z-index: 10;
    pointer-events: none;
  }

  /* Scanning line */
  #scan-line {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;

    background: red;
    box-shadow: 0 0 5px red;

    animation: scan-blink 1s infinite;
  }

  @keyframes scan-blink {
    0%, 100% {
      opacity: 1;
    }

    50% {
      opacity: 0;
    }
  }

  /* Instruction */
  #instruction {
    position: absolute;
    bottom: 30px;
    width: 100%;

    color: white;
    text-align: center;
    z-index: 15;

    font-weight: bold;
    text-shadow: 0 0 5px black;
  }
</style>
</head>

<body>

<div id="container">

  <!-- Camera -->
  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>

  <!-- Dark overlay -->
  <div id="overlay"></div>

  <!-- Viewfinder -->
  <div id="viewfinder-ui">
    <div id="scan-line"></div>
  </div>

  <!-- Instruction -->
  <div id="instruction">
    Place a barcode inside the viewfinder rectangle to scan
  </div>

</div>


<script>

  const video = document.getElementById('camera');


  /* ==========================================
     CAMERA ONLY
     ========================================== */

  async function startCamera() {

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: 'environment',
            focusMode: 'continuous'
          },

          audio: false

        });

      video.srcObject = stream;


      video.onloadedmetadata = () => {

        video.play();

        // Show camera
        video.style.opacity = "1";

      };

    }

    catch (e) {

      console.error('Camera error:', e);

    }

  }


  /* ==========================================
     START CAMERA WHEN PAGE LOADS
     ========================================== */

  window.addEventListener(
    'DOMContentLoaded',
    startCamera
  );


</script>

</body>
</html>
