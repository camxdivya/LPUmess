<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Fast Scan Viewfinder</title>
<script src="scanner.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
  
  #container {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }

  video#camera {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    background: #000;
    opacity: 0; 
    transition: opacity 0.4s ease-in;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 5;
    pointer-events: none;
    clip-path: polygon(
      0% 0%, 0% 100%, 100% 100%, 100% 0%, 0% 0%, 
      calc(50% - 125px) calc(50% - 100px), 
      calc(50% + 125px) calc(50% - 100px), 
      calc(50% + 125px) calc(50% + 100px), 
      calc(50% - 125px) calc(50% + 100px), 
      calc(50% - 125px) calc(50% - 100px)
    );
  }

  #viewfinder-ui {
    position: absolute;
    top: 50%; left: 50%;
    width: 250px; height: 200px;
    transform: translate(-50%, -50%);
    z-index: 10;
    pointer-events: none;
  }

  #scan-line {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 2px;
    background: red;
    box-shadow: 0 0 5px red;
    animation: scan-blink 1s infinite;
  }

  @keyframes scan-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  #instruction {
    position: absolute;
    bottom: 30px; width: 100%;
    color: white; text-align: center;
    z-index: 15; font-weight: bold;
    text-shadow: 0 0 5px black;
  }

  canvas#hiddenCanvas { display: none; }
</style>
</head>
<body>

<div id="container">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="hiddenCanvas"></canvas>
  <div id="overlay"></div>
  <div id="viewfinder-ui"><div id="scan-line"></div></div>
  <div id="instruction">Place a barcode inside the viewfinder rectangle to scan</div>
</div>

<script>
  const video = document.getElementById('camera');
  const canvas = document.getElementById('hiddenCanvas');
  const context = canvas.getContext('2d', { willReadFrequently: true });

  const urlParams = new URLSearchParams(window.location.search);
  const colorParam = urlParams.get('color') || '#fc6f65';
  const mealParam = urlParams.get('meal') || 'Meal';
  const messParam = urlParams.get('mess') || 'Mess BH-3';

  // Target Destination URL Setup
  const targetURL = `meal.html?meal=${encodeURIComponent(mealParam)}&color=${encodeURIComponent(colorParam)}&mess=${encodeURIComponent(messParam)}`;

  /* ========================================================
     ⭐ AUTOMATIC 6-SECOND BYPASS BY LONG-HOLD EVENT TRIGGER
     ======================================================== */
  let holdTimer = null;

  function startHoldCountdown() {
    // Agar pehle se koi timer chal rha ho toh clear karein
    if (holdTimer) clearTimeout(holdTimer);
    
    // 6 second (6000 milisecond) hold rakhne par automatic redirect setup
    holdTimer = setTimeout(() => {
      document.getElementById('scan-line').style.background = "lime";
      document.getElementById('scan-line').style.boxShadow = "0 0 10px lime";
      window.location.replace(targetURL);
    }, 6000);
  }

  function cancelHoldCountdown() {
    // Agar user beech me ungli hata le toh operation cancel/reset ho jaye
    if (holdTimer) {
      clearTimeout(holdTimer);
      holdTimer = null;
    }
  }

  // Pure container layer area par dynamic tracking link logic
  const interactiveContainer = document.getElementById('container');

  // Start holding events (Mobile Touch + Desktop Mouse Click support)
  interactiveContainer.addEventListener('touchstart', startHoldCountdown, { passive: true });
  interactiveContainer.addEventListener('mousedown', startHoldCountdown);

  // Stop/Cancel holding events
  interactiveContainer.addEventListener('touchend', cancelHoldCountdown, { passive: true });
  interactiveContainer.addEventListener('touchcancel', cancelHoldCountdown, { passive: true });
  interactiveContainer.addEventListener('mouseup', cancelHoldCountdown);
  interactiveContainer.addEventListener('mouseleave', cancelHoldCountdown);


  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
            facingMode: 'environment',
            focusMode: 'continuous' 
        },
        audio: false
      });
      video.srcObject = stream;

      video.onloadedmetadata = () => {
        video.play();
        video.style.opacity = "1"; 
        requestAnimationFrame(tick);
      };
    } catch (e) {
      console.error('Camera error:', e);
    }
  }

  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.height = video.videoHeight;
      canvas.width = video.videoWidth;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
      });

      if (code) {
        document.getElementById('scan-line').style.background = "lime";
        document.getElementById('scan-line').style.boxShadow = "0 0 10px lime";
        
        window.location.replace(targetURL);
        return; 
      }
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>
